---
- name: aap_controller | MCP note — job template writes use Controller API
  ansible.builtin.debug:
    msg: >-
      MCP exposes job_templates_list and job_templates_launch_create only (no
      job_templates_create). Creating/updating template via Controller API.

- name: aap_controller | Resolve project id for RHEL BYOL template
  when: aap_azure_rhel_project_id | int == 0
  ansible.builtin.uri:
    url: >-
      {{ aap_base_url }}/api/controller/v2/projects/?search={{
      aap_azure_rhel_project_name | urlencode
      }}
    method: GET
    validate_certs: "{{ foundry_validate_certs }}"
    force_basic_auth: true
    url_username: "{{ aap_user }}"
    url_password: "{{ aap_password }}"
    status_code: 200
  register: aap_controller_rhel_project_search
  changed_when: false

- name: aap_controller | Set RHEL BYOL project id
  when:
    - aap_azure_rhel_project_id | int == 0
    - aap_controller_rhel_project_search.json.results | length > 0
  ansible.builtin.set_fact:
    aap_azure_rhel_project_id: "{{ aap_controller_rhel_project_search.json.results[0].id }}"

- name: aap_controller | Require project for RHEL BYOL template
  ansible.builtin.assert:
    that:
      - aap_azure_rhel_project_id | int > 0
    fail_msg: >-
      Project '{{ aap_azure_rhel_project_name }}' not found. Sync SCM on Controller.

- name: aap_controller | Search existing RHEL BYOL job template
  ansible.builtin.uri:
    url: >-
      {{ aap_base_url }}/api/controller/v2/job_templates/?search={{
      aap_azure_rhel_job_template_name | urlencode
      }}&page_size=20
    method: GET
    validate_certs: "{{ foundry_validate_certs }}"
    force_basic_auth: true
    url_username: "{{ aap_user }}"
    url_password: "{{ aap_password }}"
    status_code: 200
  register: aap_controller_rhel_jt_search
  changed_when: false

- name: aap_controller | Pick matching RHEL BYOL job template
  ansible.builtin.set_fact:
    aap_controller_rhel_jt_match: >-
      {{
        (
          aap_controller_rhel_jt_search.json.results
          | selectattr('name', 'equalto', aap_azure_rhel_job_template_name)
          | list
          | first
          | default({}, true)
        )
      }}

- name: aap_controller | Serialize RHEL BYOL extra_vars
  ansible.builtin.set_fact:
    aap_azure_rhel_job_extra_vars: "{{ aap_azure_rhel_byol_default_extra_vars | to_nice_yaml }}"

- name: aap_controller | Build RHEL BYOL job template body
  ansible.builtin.set_fact:
    aap_controller_rhel_jt_body: >-
      {{
        {
          'name': aap_azure_rhel_job_template_name,
          'description': aap_azure_rhel_job_template_description,
          'job_type': 'run',
          'organization': aap_organization_id | int,
          'project': aap_azure_rhel_project_id | int,
          'inventory': aap_azure_rhel_inventory_id | int,
          'playbook': aap_azure_rhel_playbook,
          'become_enabled': false,
          'ask_variables_on_launch': aap_azure_rhel_ask_variables_on_launch,
          'extra_vars': aap_azure_rhel_job_extra_vars,
        }
        | combine(
            {'execution_environment': aap_azure_rhel_execution_environment_id | int}
            if (aap_azure_rhel_execution_environment_id | int) > 0
            else {}
          )
        | combine(
            {'credential': aap_azure_rhel_credential_id | int}
            if (aap_azure_rhel_credential_id | int) > 0
            else {}
          )
      }}

- name: aap_controller | Create RHEL BYOL job template
  when: aap_controller_rhel_jt_match.id is not defined
  ansible.builtin.uri:
    url: "{{ aap_base_url }}/api/controller/v2/job_templates/"
    method: POST
    validate_certs: "{{ foundry_validate_certs }}"
    force_basic_auth: true
    url_username: "{{ aap_user }}"
    url_password: "{{ aap_password }}"
    body_format: json
    body: "{{ aap_controller_rhel_jt_body }}"
    status_code: 201
  register: aap_controller_rhel_jt_create

- name: aap_controller | Update RHEL BYOL job template
  when: aap_controller_rhel_jt_match.id is defined
  ansible.builtin.uri:
    url: >-
      {{ aap_base_url }}/api/controller/v2/job_templates/{{
      aap_controller_rhel_jt_match.id }}/"
    method: PATCH
    validate_certs: "{{ foundry_validate_certs }}"
    force_basic_auth: true
    url_username: "{{ aap_user }}"
    url_password: "{{ aap_password }}"
    body_format: json
    body: "{{ aap_controller_rhel_jt_body }}"
    status_code: 200
  register: aap_controller_rhel_jt_update

- name: aap_controller | Record RHEL BYOL job template id
  ansible.builtin.set_fact:
    aap_azure_rhel_job_template_id: >-
      {{
        aap_controller_rhel_jt_create.json.id
        if aap_controller_rhel_jt_match.id is not defined
        else aap_controller_rhel_jt_match.id
      }}

- name: aap_controller | RHEL BYOL job template summary
  ansible.builtin.debug:
    msg:
      - "Job template id={{ aap_azure_rhel_job_template_id }} name={{ aap_azure_rhel_job_template_name }}"
      - "Project id={{ aap_azure_rhel_project_id }} playbook={{ aap_azure_rhel_playbook }}"
      - "Creates RG + RHEL BYOS VM (license_type RHEL_BYOS). Set azure_vm_ssh_public_key at launch."
      - "Attach Microsoft Azure Resource Manager credential on template if not using env vars."
      - "Alternative SCM playbooks (Playbooks project): Azure/createresourcegroup.yml + Azure/createvm.yml"
