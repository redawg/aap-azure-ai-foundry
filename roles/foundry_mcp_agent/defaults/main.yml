---
foundry_model_deployment_name: claude-sonnet-4-5
foundry_mcp_connection_name: aap-mcp-bearer
foundry_agent_name: aap-automation-agent
foundry_mcp_server_label: ansible-aap
foundry_mcp_require_approval: always
foundry_connections_api_version: v1
foundry_agents_api_version: v1
foundry_agent_token: ""
foundry_az_scope: https://ai.azure.com/.default

foundry_verify_mcp_before_register: true
foundry_register_agent: true
foundry_validate_certs: false

aap_user: admin
aap_password: ""

aap_mcp_base_url: https://aap-mcp-aap.apps.cluster-wg2cd-2.dynamic2.redhatworkshops.io
aap_mcp_server_path: /mcp

# Full text from scripts/foundry_instructions.py (requires PyYAML on controller)
foundry_agent_instructions: >-
  {{ lookup('pipe', 'python3 ' + playbook_dir + '/../scripts/foundry_instructions.py') }}
foundry_alert_template_map_path: "{{ playbook_dir }}/../config/azure_alert_template_map.yml"

foundry_mcp_toolsets:
  - job_management
  - inventory_management
  - system_monitoring
  - user_management
  - security_compliance
  - platform_configuration
