---
- name: foundry_mcp_agent | Ensure required variables are set
  ansible.builtin.assert:
    that:
      - foundry_project_endpoint | length > 0
      - aap_mcp_base_url | length > 0
      - aap_user | length > 0
      - aap_password | length > 0
    fail_msg: >-
      Copy group_vars/all.yml.example to group_vars/all.yml and set
      foundry_project_endpoint (or foundry_account + foundry_project), aap_password,
      and aap_mcp_base_url.

- name: foundry_mcp_agent | Ensure model is set when creating an agent
  when: foundry_register_agent | bool
  ansible.builtin.assert:
    that:
      - foundry_model_deployment_name | length > 0
    fail_msg: Set foundry_model_deployment_name when foundry_register_agent is true.
