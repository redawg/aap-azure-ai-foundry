---
# Register an existing AAP MCP server with Microsoft Copilot Studio (primary).
#
#   cp group_vars/all.yml.example group_vars/all.yml
#   ansible-playbook playbooks/site.yml
#
# Tags: verify_mcp | copilot_openapi | copilot_wizard | copilot_artifacts | copilot_connector
# Mode: copilot_setup_mode in group_vars — wizard | connector | both (default: both)
#
# Legacy Azure AI Foundry: ansible-playbook playbooks/foundry-site.yml

- name: Verify AAP MCP and generate OpenAPI for Copilot Studio
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: copilot_mcp
      tags:
        - copilot_mcp
        - verify_mcp
        - copilot_openapi

- name: Copilot Studio MCP wizard instructions
  ansible.builtin.import_playbook: prepare-copilot-wizard.yml

- name: Copilot Studio custom connector artifacts
  ansible.builtin.import_playbook: prepare-copilot-setup.yml

- name: Copilot Studio Power Platform connector automation
  ansible.builtin.import_playbook: setup-copilot-mcp.yml

- name: Summarize Copilot Studio setup
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Display next steps
      ansible.builtin.debug:
        msg:
          - "AAP MCP base: {{ aap_mcp_base_url }}"
          - "OpenAPI: aap-mcp-openapi.yaml ({{ aap_mcp_toolsets | length }} toolsets + unified /mcp)"
          - "Wizard: copilot-setup-artifacts/MCP-SETUP-WIZARD.md"
          - "Connector: copilot-setup-artifacts/SETUP-INSTRUCTIONS.txt"
          - "Copilot Studio: https://copilotstudio.microsoft.com"
          - "Enable generative orchestration on your agent (required for MCP)"
          - "Legacy Foundry: ansible-playbook playbooks/foundry-site.yml"
      tags:
        - copilot_mcp
