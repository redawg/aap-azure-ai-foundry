---
# Register an existing Ansible MCP server with Azure AI Foundry.
#
# Prerequisites:
#   cp group_vars/all.yml.example group_vars/all.yml  (set secrets)
#   az login
#
# Usage:
#   ansible-playbook playbooks/site.yml
#
# Tags:
#   foundry_verify_mcp   — probe MCP initialize + tools/list only
#   foundry_connection   — ARM project connection only
#   foundry_agent        — create agent (requires connection)
#   foundry_gateway_token — create AAP Gateway Bearer token only
#   foundry_mcp_agent    — full flow (default)

- name: Configure Ansible MCP server in Azure AI Foundry
  hosts: foundry
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname }}"

  roles:
    - role: foundry_mcp_agent
      tags:
        - foundry_mcp_agent

  post_tasks:
    - name: Summarize Foundry MCP registration
      ansible.builtin.debug:
        msg:
          - "MCP server URL: {{ aap_mcp_server_url }}"
          - "Foundry connection: {{ foundry_mcp_connection_name }} (Custom keys → Authorization: Bearer …)"
          - "Foundry agent: {{ foundry_agent_name }} (model: {{ foundry_model_deployment_name }})"
          - "Portal: set connection Custom key Authorization if tools fail in Playground"
          - "Test: https://ai.azure.com → {{ foundry_project }} → Agents → {{ foundry_agent_name }}"
          - "Azure alert sample: {{ repo_root }}/examples/azure-alert-mcp-404.json"
          - "Update instructions: ansible-playbook playbooks/update-agent-instructions.yml"
      tags:
        - foundry_mcp_agent
