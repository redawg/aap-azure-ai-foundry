---
# Remove Foundry agents, MCP connection, and optional extra ARM projects.
#
#   ansible-playbook playbooks/cleanup-foundry.yml
#   ansible-playbook playbooks/cleanup-foundry.yml -e foundry_delete_extra_projects=true
#
- name: Clean up Foundry MCP registration
  hosts: foundry
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    foundry_register_agent: false
    foundry_register_connection_arm: false
    foundry_verify_mcp_before_register: false
    foundry_verify_mcp_tools_list: false
    foundry_delete_extra_projects: "{{ delete_extra_projects | default(false) }}"

  pre_tasks:
    - name: Derive Foundry project endpoint when omitted
      when: foundry_project_endpoint | length == 0
      ansible.builtin.set_fact:
        foundry_project_endpoint: >-
          https://{{ foundry_account }}.services.ai.azure.com/api/projects/{{ foundry_project }}

  tasks:
    - name: Authenticate to Foundry data plane
      ansible.builtin.include_role:
        name: foundry_mcp_agent
        tasks_from: authenticate.yml

    - name: Authenticate to Azure management plane
      ansible.builtin.include_role:
        name: foundry_mcp_agent
        tasks_from: authenticate-mgmt.yml

    - name: Delete Foundry agents and connections
      ansible.builtin.include_role:
        name: foundry_mcp_agent
        tasks_from: cleanup.yml

  post_tasks:
    - name: Cleanup complete
      ansible.builtin.debug:
        msg: "Redeploy with: ansible-playbook playbooks/site.yml"
