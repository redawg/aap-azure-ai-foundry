---
# Create an Azure resource group and a RHEL BYOS (BYOL) virtual machine.
#
# Requires azure.azcollection and Azure credentials (credential or env vars).
#
#   ansible-playbook playbooks/azure-rhel-byol-server.yml -e @group_vars/all.yml \
#     -e azure_rg_name=my-rg -e azure_vm_name=my-rhel -e azure_vm_ssh_public_key="$(cat ~/.ssh/id_rsa.pub)"
#
- name: Azure resource group and RHEL BYOS server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    az_rgname: "{{ azure_rg_name }}"
    az_vmname: "{{ azure_vm_name }}"
    az_vmusername: "{{ azure_vm_admin_user | default('azureuser') }}"
    sshpubkey: "{{ azure_vm_ssh_public_key }}"
    azure_location: "{{ azure_location | default('eastus') }}"
    azure_vm_size: "{{ azure_vm_size | default('Standard_D2s_v3') }}"
    azure_rhel_offer: "{{ azure_rhel_offer | default('rhel-byos') }}"
    azure_rhel_publisher: RedHat
    azure_rhel_sku: "{{ azure_rhel_sku | default('rhel-lvm79') }}"
    azure_rhel_plan_name: "{{ azure_rhel_plan_name | default(azure_rhel_sku) }}"
    azure_vnet_name: "{{ az_rgname }}-vnet"
    azure_subnet_name: default
    azure_address_prefix: 10.20.0.0/16
    azure_subnet_prefix: 10.20.1.0/24

  tasks:
    - name: Create Azure resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ az_rgname }}"
        location: "{{ azure_location }}"
        tags:
          created: ansible
          purpose: rhel-byol-demo

    - name: Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ az_rgname }}"
        name: "{{ azure_vnet_name }}"
        address_prefixes:
          - "{{ azure_address_prefix }}"

    - name: Create subnet
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ az_rgname }}"
        virtual_network_name: "{{ azure_vnet_name }}"
        name: "{{ azure_subnet_name }}"
        address_prefix: "{{ azure_subnet_prefix }}"

    - name: Create network security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ az_rgname }}"
        name: "{{ az_vmname }}-nsg"
        rules:
          - name: SSH
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 1001
            direction: Inbound

    - name: Create public IP for VM
      when: azure_vm_public_ip | default(true) | bool
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ az_rgname }}"
        name: "{{ az_vmname }}-pip"
        allocation_method: static
        sku: standard

    - name: Create NIC
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ az_rgname }}"
        name: "{{ az_vmname }}-nic"
        virtual_network: "{{ azure_vnet_name }}"
        subnet: "{{ azure_subnet_name }}"
        security_group: "{{ az_vmname }}-nsg"
        ip_configurations:
          - name: default
            private_ip_allocation_method: Dynamic
            public_ip_address_name: "{{ az_vmname }}-pip"
      when: azure_vm_public_ip | default(true) | bool

    - name: Create NIC without public IP
      when: not (azure_vm_public_ip | default(true) | bool)
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ az_rgname }}"
        name: "{{ az_vmname }}-nic"
        virtual_network: "{{ azure_vnet_name }}"
        subnet: "{{ azure_subnet_name }}"
        security_group: "{{ az_vmname }}-nsg"
        ip_configurations:
          - name: default
            private_ip_allocation_method: Dynamic

    - name: Create RHEL BYOS virtual machine
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ az_rgname }}"
        name: "{{ az_vmname }}"
        vm_size: "{{ azure_vm_size }}"
        admin_username: "{{ az_vmusername }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ az_vmusername }}/.ssh/authorized_keys"
            key_data: "{{ sshpubkey }}"
        network_interfaces: "{{ az_vmname }}-nic"
        license_type: RHEL_BYOS
        image:
          offer: "{{ azure_rhel_offer }}"
          publisher: "{{ azure_rhel_publisher }}"
          sku: "{{ azure_rhel_sku }}"
          version: latest
        plan:
          name: "{{ azure_rhel_plan_name }}"
          product: "{{ azure_rhel_offer }}"
          publisher: redhat
        tags:
          os: rhel-byos
          managed_by: aap

    - name: Show VM provisioning result
      ansible.builtin.debug:
        msg:
          - "Resource group: {{ az_rgname }} ({{ azure_location }})"
          - "VM: {{ az_vmname }} ({{ azure_vm_size }}, RHEL BYOS / license_type RHEL_BYOS)"
          - "Image: {{ azure_rhel_publisher }}/{{ azure_rhel_offer }}/{{ azure_rhel_sku }}"
