---
# Create and display an AAP Gateway API token (for MCP Bearer auth).
#
#   ansible-playbook playbooks/create-gateway-token.yml
#
- name: Create AAP Gateway token
  hosts: foundry
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname }}"

  tasks:
    - name: Create Gateway token
      ansible.builtin.include_role:
        name: foundry_mcp_agent
        tasks_from: gateway-token.yml

    - name: Show Bearer value for Foundry portal
      ansible.builtin.debug:
        msg:
          - "Foundry → Connected resources → aap-mcp-bearer → Custom keys (two fields):"
          - "  Key name (left column):  Authorization"
          - "  Key value (right column): Bearer {{ aap_gateway_token }}"
          - "Do NOT use 'Value' as the key name — that causes 'Failed to add header Value:' errors."
