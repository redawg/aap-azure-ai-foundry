---
# Apply Red Hat service account for Automation Analytics (article 7112649).
# Create account: https://console.redhat.com/iam/service-accounts
#
#   cp group_vars/all.yml.example group_vars/all.yml
#   ansible-playbook playbooks/aap-redhat-analytics-service-account.yml \
#     -e redhat_analytics_client_id=… -e redhat_analytics_client_secret=…
#
- name: Configure Red Hat Analytics service account on AAP 2.6
  hosts: foundry
  gather_facts: false
  vars:
    foundry_validate_certs: "{{ foundry_validate_certs | default(false) }}"

  pre_tasks:
    - name: Load group_vars/all.yml when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | dirname }}/group_vars/all.yml"
      failed_when: false

  tasks:
    - name: Require AAP password
      ansible.builtin.assert:
        that:
          - aap_password is defined
          - aap_password | length > 0
        fail_msg: Set aap_password in group_vars/all.yml or -e aap_password=…

    - name: Require service account credentials
      ansible.builtin.assert:
        that:
          - redhat_analytics_client_id | length > 0
          - redhat_analytics_client_secret | length > 0
        fail_msg: >-
          Set redhat_analytics_client_id and redhat_analytics_client_secret from
          console.redhat.com/iam/service-accounts (see docs/REDHAT-CONSOLE-CREDENTIALS.md).

    - name: Patch Controller system settings (service account)
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/controller/v2/settings/system/"
        method: PATCH
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        body_format: json
        body:
          SUBSCRIPTIONS_CLIENT_ID: "{{ redhat_analytics_client_id }}"
          SUBSCRIPTIONS_CLIENT_SECRET: "{{ redhat_analytics_client_secret }}"
          INSIGHTS_TRACKING_STATE: true
        status_code: 200
      register: aap_redhat_analytics_patch
      failed_when: aap_redhat_analytics_patch.status != 200

    - name: Confirm client ID stored on controller
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/controller/v2/settings/system/"
        method: GET
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        return_content: true
        status_code: 200
      register: aap_redhat_analytics_verify
      changed_when: false

    - name: Validate service account applied
      ansible.builtin.assert:
        that:
          - aap_redhat_analytics_verify.json.SUBSCRIPTIONS_CLIENT_ID == redhat_analytics_client_id
          - aap_redhat_analytics_verify.json.SUBSCRIPTIONS_CLIENT_SECRET | length > 0
          - aap_redhat_analytics_verify.json.INSIGHTS_TRACKING_STATE | bool

    - name: Patch Gateway analytics settings when available
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/gateway/v1/settings/analytics/"
        method: PATCH
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        body_format: json
        body:
          INSIGHTS_TRACKING_STATE: true
        status_code: [200, 204]
      failed_when: false

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Service account applied. Run a job, then check console.redhat.com → Automation Analytics."
          - "Galaxy/Hub token is separate: docs/REDHAT-CONSOLE-CREDENTIALS.md §2."
