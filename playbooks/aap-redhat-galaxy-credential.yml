---
# Update Ansible Galaxy / Automation Hub credential (Controller API).
# Get token from https://console.redhat.com/ansible/automation-hub/token
# See docs/REDHAT-CONSOLE-CREDENTIALS.md
#
#   cp group_vars/all.yml.example group_vars/all.yml   # set aap_password
#   ansible-playbook playbooks/aap-redhat-galaxy-credential.yml \
#     -e aap_galaxy_api_token=YOUR_REAL_TOKEN_FROM_CONSOLE
#
- name: Configure Red Hat Automation Hub Galaxy credential
  hosts: foundry
  gather_facts: false
  vars:
    aap_base_url: "{{ aap_base_url | default('https://aap-aap.apps.cluster-wg2cd-2.dynamic2.redhatworkshops.io') }}"
    aap_user: "{{ aap_user | default('admin') }}"
    aap_galaxy_credential_name: "{{ aap_galaxy_credential_name | default('Red Hat Automation Hub') }}"
    aap_galaxy_hub_url: "{{ aap_galaxy_hub_url | default('https://console.redhat.com/api/automation-hub/') }}"
    aap_galaxy_auth_url: "{{ aap_galaxy_auth_url | default('https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token') }}"
    aap_organization_id: "{{ aap_organization_id | default(1) }}"
    foundry_validate_certs: "{{ foundry_validate_certs | default(false) }}"

  pre_tasks:
    - name: Load group_vars/all.yml when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | dirname }}/group_vars/all.yml"
      failed_when: false

  tasks:
    - name: Require AAP password
      ansible.builtin.assert:
        that:
          - aap_password is defined
          - aap_password | length > 0
        fail_msg: >-
          Set aap_password in group_vars/all.yml (copy from all.yml.example) or
          pass -e aap_password=…

    - name: Require real Galaxy API token
      ansible.builtin.assert:
        that:
          - aap_galaxy_api_token | length > 0
          - aap_galaxy_api_token != 'PASTE_OFFLINE_TOKEN'
          - aap_galaxy_api_token | length > 40
        fail_msg: >-
          Set aap_galaxy_api_token to the token from
          console.redhat.com/ansible/automation-hub/token (Load token).
          Do not use the placeholder PASTE_OFFLINE_TOKEN.

    - name: Look up Galaxy credential by name
      ansible.builtin.uri:
        url: >-
          {{ aap_base_url }}/api/controller/v2/credentials/?credential_type=19&name={{ aap_galaxy_credential_name | urlencode }}
        method: GET
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        return_content: true
        status_code: 200
      register: aap_galaxy_cred_lookup
      changed_when: false

    - name: Create Galaxy credential
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/controller/v2/credentials/"
        method: POST
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        body_format: json
        body:
          name: "{{ aap_galaxy_credential_name }}"
          credential_type: 19
          organization: "{{ aap_organization_id }}"
          inputs:
            url: "{{ aap_galaxy_hub_url }}"
            auth_url: "{{ aap_galaxy_auth_url }}"
            token: "{{ aap_galaxy_api_token }}"
        status_code: 201
      register: aap_galaxy_cred_create
      when: aap_galaxy_cred_lookup.json.results | length == 0
      no_log: true

    - name: Set credential id from lookup
      ansible.builtin.set_fact:
        aap_galaxy_credential_id: "{{ (aap_galaxy_cred_lookup.json.results | first).id }}"
      when: aap_galaxy_cred_lookup.json.results | length > 0

    - name: Set credential id from create
      ansible.builtin.set_fact:
        aap_galaxy_credential_id: "{{ aap_galaxy_cred_create.json.id }}"
      when: aap_galaxy_cred_create is changed

    - name: Update non-managed Galaxy credential
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/controller/v2/credentials/{{ aap_galaxy_credential_id }}/"
        method: PATCH
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        body_format: json
        body:
          inputs:
            url: "{{ aap_galaxy_hub_url }}"
            auth_url: "{{ aap_galaxy_auth_url }}"
            token: "{{ aap_galaxy_api_token }}"
        status_code: 200
      register: aap_galaxy_cred_patch
      when:
        - aap_galaxy_cred_lookup.json.results | length > 0
        - not (aap_galaxy_cred_lookup.json.results | first).managed | default(false)
      no_log: true

    - name: Note managed Ansible Galaxy credential cannot be edited
      ansible.builtin.debug:
        msg:
          - "Built-in managed credential 'Ansible Galaxy' (id 2) cannot be modified via API."
          - "Using credential '{{ aap_galaxy_credential_name }}' id={{ aap_galaxy_credential_id }} instead."
          - "Assign it under Automation Execution → Organizations → Default → Galaxy Credentials."
      when: aap_galaxy_cred_lookup.json.results | length == 0 or (aap_galaxy_cred_create is changed)

    - name: Attach Galaxy credential to Default organization
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/controller/v2/organizations/{{ aap_organization_id }}/"
        method: PATCH
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        body_format: json
        body:
          galaxy_credentials:
            - "{{ aap_galaxy_credential_id }}"
        status_code: 200
      register: aap_galaxy_org_patch
      failed_when: false

    - name: Test Galaxy credential
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/controller/v2/credentials/{{ aap_galaxy_credential_id }}/test/"
        method: POST
        validate_certs: "{{ foundry_validate_certs }}"
        force_basic_auth: true
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        body_format: json
        body: {}
        status_code: [200, 202]
      register: aap_galaxy_cred_test
      failed_when: false

    - name: Show result
      ansible.builtin.debug:
        msg:
          - "Galaxy credential id={{ aap_galaxy_credential_id }}"
          - "Hub URL={{ aap_galaxy_hub_url }}"
          - "Org galaxy_credentials patch: {{ aap_galaxy_org_patch.status | default('skipped') }}"
          - "Credential test response: {{ aap_galaxy_cred_test.json | default(aap_galaxy_cred_test.msg | default('n/a')) }}"
