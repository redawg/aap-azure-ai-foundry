# Map Azure Monitor / Foundry alert signals to AAP job templates (workshop cluster).
# The agent loads this at registration time; extend for your environment.

templates:
  - id: 13
    name: Register AAP MCP with Azure Foundry
    org: Default
    use_when:
      - foundry
      - mcp
      - model context protocol
      - connection
      - authorization
      - bearer
      - deploymentnotfound
      - enumerating tools
      - remote mcp server
      - ai.azure.com
      - cognitive services
  - id: 7
    name: Demo Job Template
    org: Default
    use_when:
      - demo
      - test
      - smoke
      - generic
      - unknown alert
      - remediation
      - health check
  - id: 9
    name: APD | Single demo setup
    org: Ansible Product Demos (APD)
    use_when:
      - single host
      - one vm
      - single resource
      - app service
      - small footprint
  - id: 10
    name: APD | Multi-demo setup
    org: Ansible Product Demos (APD)
    use_when:
      - multiple hosts
      - scale set
      - vmss
      - cluster
      - aks
      - multi-resource
      - bulk
  - id: 38
    name: Azure RG + RHEL BYOS Server
    org: Default
    use_when:
      - resource group
      - rhel
      - byos
      - byol
      - red hat
      - virtual machine
      - vm deployment
      - compute
      - azure rm
      - provision
      - failed deployment
      - image publisher
  - id: 37
    name: Azure VM + Foundry Alerts
    org: Default
    use_when:
      - fedora
      - foundry
      - metric alert
      - cpu
      - percentage cpu
      - monitor
      - function app
      - alert bridge
      - openenv
  - id: 39
    name: Cisco SNMP compliance check
    org: Default
    use_when:
      - snmp
      - cisco
      - ios
      - network device
      - community string
      - snmp-server
      - configuration changed
      - baseline
      - compliance
      - core-sw
      - switch
      - router

alert_field_hints:
  - alertRuleName
  - alertRuleDescription
  - severity
  - signalType
  - monitorCondition
  - resourceId
  - resourceType
  - operationName
  - properties.errorMessage
  - properties.message
  - essentials.alertRule
  - essentials.description
